[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fechou"
version = "0.1.0"
description = "Relatório semanal automático a partir de planilhas (CSV ou Google Sheets), em PDF, entregue por e-mail ou Telegram."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rodolfo Miranda" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Portuguese (Brazilian)",
    "Environment :: Console",
]
# Runtime dependencies are added phase by phase (see PROJETO.md, section 15).
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fechou = "fechou.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fechou"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # prefer pathlib
    "DTZ", # naive datetimes (timezones matter in this project)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.ruff.format]
quote-style = "double"

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
