# Exemplo de configuração do Fechou.
# Caminhos relativos são resolvidos a partir da pasta deste arquivo.
# Segredos (SMTP, Telegram, Google) ficam no .env, nunca aqui.

source:
  id: loja-demo          # letras minúsculas, números, '-' ou '_'
  type: csv              # csv | google_sheets
  path: vendas_demo.csv
  delimiter: ","
  # Para ler do Google Sheets, troque as linhas type/path/delimiter por:
  # type: google_sheets
  # spreadsheet_id: "1AbC...xyz"   # ID ou URL completa da planilha
  # worksheet: "Vendas"            # nome exato da aba
  # range: "A1:F"                  # opcional; a 1ª linha do intervalo é o cabeçalho
  # (e defina GOOGLE_APPLICATION_CREDENTIALS no .env; veja o README)

columns:                 # nome interno: nome da coluna na planilha
  date: "Data"
  product: "Produto"
  category: "Categoria"  # opcional
  quantity: "Qtd"
  unit_price: "Preço"
  seller: "Vendedor"     # opcional

report:
  title: "Relatório semanal de vendas"
  business_name: "Loja Demo"
  timezone: "America/Sao_Paulo"
  empty_period_policy: "send_empty"   # send_empty | skip
  accent_color: "#1f6f5c"
  # logo_path: logo.png

delivery:
  email:
    enabled: true
    to: ["dono@exemplo.com"]
    subject: "Fechamento da semana {start} a {end}"
  telegram:
    enabled: false
