name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install WeasyPrint system libraries (Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        env:
          FECHOU_REQUIRE_PDF: "1"  # fail instead of skipping PDF tests
        run: pytest

  docker:
    name: Docker image (demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag fechou:ci .

      - name: Run demo inside the image
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --volume "$PWD/out:/app/out" fechou:ci demo
          ls -l out
          test -n "$(find out -name 'fechou_*.pdf' -size +10k)"
